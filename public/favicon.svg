<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Warm Earthy Charcoal Background with smooth rounded edges -->
  <rect width="100" height="100" rx="24" fill="#3A2F27"/>
  <!-- Minimalist Geometric Architecture / Living Icon with Caramel and Cream -->
  <!-- Outer circle / arch -->
  <circle cx="50" cy="50" r="34" stroke="#B57F57" stroke-width="4" fill="none" opacity="0.9"/>
  <!-- Modern Geometric 'Q' leg -->
  <line x1="62" y1="62" x2="74" y2="74" stroke="#B57F57" stroke-width="5" stroke-linecap="round"/>
  <!-- Minimalist Inner Table / Horizon Line in Cream -->
  <rect x="36" y="46" width="28" height="3" rx="1.5" fill="#F9F7F2"/>
  <!-- Clean Warm Living Silhouette / Lamp -->
  <circle cx="50" cy="38" r="4.5" fill="#D7B899"/>
</svg>
